name: CI

# Controls when the action will run.
on:
  # Run branch pushes too, so contributors see the full CI matrix before a PR.
  push:
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # Keep the broad cross-platform/version matrix supplied by bazel-contrib,
  # but do not rely on its wildcard targets as the required test gate: Bazel
  # deliberately omits manual-tagged tests from `//...` expansion.
  test:
    uses: bazel-contrib/.github/.github/workflows/bazel.yaml@v7.2.3
    with:
      folders: |
        [
          ".",
          "gazelle",
          "e2e/smoke"
        ]
      exclude: |
        [
          {"bazelversion": "8.0.0"},
          {"folder": ".", "bzlmodEnabled": false},
          {"folder": "gazelle", "bzlmodEnabled": false},
          {"folder": "e2e/smoke", "bzlmodEnabled": false}
        ]
      exclude_windows: true
  # The standalone example consumes rules_flutter as a plain bazel_dep; in-repo
  # CI overrides it with the working tree. Its .bazelversion is the minimum
  # accepted by rules_flutter, so this also covers the supported Bazel floor.
  # After the first BCR release, a no-override leg is added as the "did the
  # release actually publish" canary.
  example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the example against the working tree
        working-directory: examples/hello_world
        run: |
          bazel test --override_module=rules_flutter=$GITHUB_WORKSPACE //...
          bazel build --override_module=rules_flutter=$GITHUB_WORKSPACE //:app.web
          git diff --exit-code -- MODULE.bazel.lock pubspec.lock
  # Name the required suite explicitly so its manual-tagged analysis tests are
  # actually executed. Keep the docs target in the same invocation so both use
  # the pinned .bazelversion expected by the generated-doc goldens.
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Core and docs tests at the pinned Bazel
        run: bazel test //flutter/tests:all_tests //docs:update_tests

  # `bazel test //...` does not prove that every intended external-workspace
  # integration test remains wired into the aggregate suite. This is the same
  # command contributors are required to run before completing a change.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: External smoke integration suite
        working-directory: e2e/smoke
        run: bazel test //:integration_tests

  # Gazelle owns generated BUILD targets. Regenerate them in CI so a change to
  # sources or plugin behavior cannot merge with stale generated metadata.
  gazelle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generated Bazel targets are up to date
        run: |
          bazel run //:gazelle
          git diff --exit-code

  # `bazel mod tidy` must be a no-op: the pub extension reports its
  # repositories through extension_metadata, so use_repo() is machine
  # maintained and a stale list is a review error, not a runtime surprise.
  mod-tidy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        folder: [".", "e2e/smoke", "examples/hello_world"]
    steps:
      - uses: actions/checkout@v4
      - name: bazel mod tidy is clean
        working-directory: ${{ matrix.folder }}
        run: |
          bazel mod tidy
          git diff --exit-code -- MODULE.bazel MODULE.bazel.lock

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs: [test, example, core, integration, gazelle, mod-tidy, pre-commit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every CI job to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          EXAMPLE_RESULT: ${{ needs.example.result }}
          GAZELLE_RESULT: ${{ needs.gazelle.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          MOD_TIDY_RESULT: ${{ needs.mod-tidy.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          for result in \
            "$TEST_RESULT" \
            "$EXAMPLE_RESULT" \
            "$CORE_RESULT" \
            "$INTEGRATION_RESULT" \
            "$GAZELLE_RESULT" \
            "$MOD_TIDY_RESULT" \
            "$PRE_COMMIT_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required CI job concluded with: $result"
              exit 1
            fi
          done
